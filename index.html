<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="logo">MY WEBSITE</a>
        <nav>
            <a href="#about">ABOUT</a>
            <a href="#works">WORKS</a>
            <a href="#contact">CONTACT</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <p class="small-text">WELCOME TO MY WEBSITE</p>
            <h1>Hello,<br>I'm <span>YOUR NAME</span>.</h1>
            <p class="description">
                シンプルなデザインと、ものづくりが好きです。
            </p>
        </section>
        <section id="about" class="section">
            <p class="section-number">01</p>
            <h2>ABOUT</h2>
            <p>
                ここに自己紹介を書きます。<br>
                自分のことや好きなこと、活動していることなどを紹介します。
            </p>
        </section>
        <section id="works" class="section">
            <p class="section-number">02</p>
            <h2>WORKS</h2>
            <p>
                ここに制作したものやプロジェクトを載せます。
            </p>
        </section>
        <section id="contact" class="section">
            <p class="section-number">03</p>
            <h2>CONTACT</h2>
            <p>
                連絡先やSNSなどをここに載せます。
            </p>
        </section>
    </main>
    <footer>
        <p>© 2026 YOUR NAME</p>
    </footer>
</body>
</html>
